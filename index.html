<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#eef2f6" />
  <title>地产模拟</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./vendor/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./vendor/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <script>
    // 字体模式：?font=pixel 用像素字体，?bold=synth 用浏览器合成粗体
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get('font') === 'pixel') document.documentElement.classList.add('font-pixel');
      if (p.get('bold') === 'synth') document.documentElement.classList.add('synth-bold');
    })();
  </script>
</head>
<body>
  <div id="stage">
    <div id="app"></div>
    <div id="boot-status">正在初始化…</div>
  </div>

  <!-- wasmoon（Lua 5.4 → WebAssembly），UMD 构建，暴露 window.wasmoon -->
  <script src="./vendor/wasmoon/index.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
